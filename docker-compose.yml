# 非飞牛环境用这份 compose 起「桥接」（群晖 / 威联通 / 绿联 / 极空间 / 普通 Linux / Windows Docker）
#
# 范围说明：这里只有 8790 桥接——曲库索引、播放控制、固定指令、唤醒词、OpenClaw 转发都在里面。
# 8900 控制台是飞牛套件的一部分（宿主 python 进程 + 应用框架），不在这份 compose 里。
#
# 用法：
#   mkdir -p data
#   cp app/bridge/config.example.json data/config.json
#   docker compose up -d --build
#   浏览器打开 http://<这台机器的局域网地址>:8790
#
# 升级：git pull && docker compose up -d --build

services:
  bridge:
    build:
      context: ./app/bridge
    image: xiaoai-bridge:latest
    container_name: xiaoai-bridge
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      TZ: Asia/Shanghai
      # 音箱要按这个地址回来拉音频，必须写宿主机的局域网地址，不能写 127.0.0.1
      XIAOAI_PUBLIC_BASE: "http://192.168.1.10:8790"
      XIAOAI_HOST_IP: "192.168.1.10"
    volumes:
      # 配置文件必须在启动前存在，否则 Docker 会把它建成目录
      - ./data/config.json:/app/config.json
      - ./data/conf:/app/conf
      - ./data/media:/app/media
      - ./data/logs:/app/logs
      # 曲库目录：改成你自己的音乐路径。容器内外路径保持一致，
      # 因为这个路径要原样填进「音乐路径」里。
      - /mnt/music:/mnt/music:ro
      # 接了 OpenClaw 才需要。整目录可写，因为界面里切后端模型要改 openclaw.json
      # - /path/to/.openclaw:/oc
